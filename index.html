<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#0b3d91">
<title>Ferretería Quilvio – ManteniPro v2.1.0</title>
<style>
:root{--azul:#0b3d91;--azul2:#1565c0;--rojo:#c62828;--ama:#f9a825;--verde:#2e7d32;--gris:#f3f5f9;--borde:#d5dbe5}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--gris);color:#1d2433}
header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;display:flex;align-items:center;gap:10px}
#who{font-size:13px;opacity:.9}
#hdrLogo{height:40px;width:40px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.empresa{display:flex;flex-direction:column;line-height:1.15}.empresa b{font-size:18px}.empresa small{font-size:12px;opacity:.85;font-weight:normal}
#loginLogo{display:block;margin:0 auto 10px;max-width:200px;max-height:220px}
nav{display:flex;gap:4px;flex-wrap:wrap;background:#fff;padding:6px 10px;border-bottom:1px solid var(--borde)}
nav button{background:none;border:none;padding:8px 12px;cursor:pointer;border-radius:6px;font-size:14px}
nav button.act{background:var(--azul2);color:#fff}
main{padding:16px;max-width:1300px;margin:auto}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;padding:14px;border-left:6px solid var(--azul2)}
.kpi b{font-size:28px;display:block}.kpi.r{border-color:var(--rojo)}.kpi.a{border-color:var(--ama)}.kpi.v{border-color:var(--verde)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
th{background:#e8edf6;position:sticky;top:0}.tw{overflow:auto;max-height:520px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.t-r{background:var(--rojo)}.t-a{background:var(--ama);color:#000}.t-v{background:var(--verde)}.t-g{background:#78849e}.t-b{background:var(--azul2)}
.st-Bajo{background:var(--verde)}.st-Medio{background:var(--ama);color:#000}.st-Alto{background:var(--rojo)}
input,select,textarea{padding:7px;border:1px solid var(--borde);border-radius:6px;font-size:14px;width:100%}
label{font-size:12px;color:#4a5568;display:block;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.btn{background:var(--azul2);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.s{background:#fff;color:var(--azul2);border:1px solid var(--azul2)}.btn.r{background:var(--rojo)}.btn.v{background:var(--verde)}.btn.sm{padding:4px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#login{max-width:380px;margin:60px auto}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
.modal .card{width:100%;max-width:620px;max-height:92vh;overflow:auto}
.hide{display:none!important}h2{margin:4px 0 12px;font-size:18px}
#nubeB{font-size:12px}
.alerta-v{border:4px solid var(--rojo);animation:pop .25s ease-out,parpadeo 2s ease-in-out .25s infinite}
.alerta-v h2{animation:parpadeoTxt 2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes parpadeo{0%,100%{border-color:var(--rojo);box-shadow:0 0 0 0 rgba(198,40,40,0);background:#fff}50%{border-color:#ff5252;box-shadow:0 0 28px 8px rgba(198,40,40,.75);background:#ffebee}}
@keyframes parpadeoTxt{0%,100%{opacity:1}50%{opacity:.35}}
#bellV{animation:parpadeoTxt 2s ease-in-out infinite;background:var(--rojo);color:#fff;border:none;border-radius:14px;padding:3px 10px;cursor:pointer;font-weight:bold;display:none}
@media (prefers-reduced-motion:reduce){.alerta-v,.alerta-v h2,#bellV{animation:none}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px;box-shadow:0 4px 12px #0004;display:none}
</style>
</head>
<body>

<div id="login" class="card">
  <img id="loginLogo" alt="Ferretería Quilvio">
  <h2 style="text-align:center">ManteniPro – Mantenimiento de Equipos</h2>
  <div id="cfgBox" class="hide">
    <p style="font-size:13px">☁️ Conecte el programa a su base de datos en la nube (Supabase). Se hace una sola vez en cada equipo.</p>
    <label>URL del proyecto<input id="cfUrl" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off"></label>
    <label>Clave pública (anon / publishable key)<input id="cfKey" autocomplete="off"></label>
    <button class="btn" onclick="guardarCfg()">Conectar</button>
  </div>
  <div id="loginBox" class="hide">
    <label>Correo<input id="lu" type="email" autocomplete="username"></label>
    <label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label>
    <button class="btn" id="btnEntrar" onclick="login()">Entrar</button>
    <p style="font-size:12px;color:#777">☁️ Base de datos en la nube · <a href="#" onclick="verCfg();return false">Cambiar conexión</a></p>
  </div>
  <p id="loginMsg" style="font-size:13px;color:var(--rojo)"></p>
</div>

<div id="app" class="hide">
<header><h1><img id="hdrLogo" alt="Logo"><span class="empresa"><b id="hdrEmpresa">Ferretería Quilvio</b><small>ManteniPro – Mantenimiento de Equipos · v2.1.0</small></span></h1>
<span id="nubeB" class="tag"></span><button id="bellV" title="Mantenimientos vencidos" onclick="popupVencidos(true)"></button>
<span id="who"></span><button class="btn s sm" onclick="miCuenta()">👤 Mi cuenta</button><button class="btn s sm" onclick="logout()">Salir</button></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<div class="modal" id="modal"><div class="card" id="mbody"></div></div>
<div id="toast"></div>

/* Acepta datos de versiones anteriores (respaldos JSON, base local) */
function normalizar(d){
  d=d||{};
  ['equipos','planes','ots','log'].forEach(t=>{if(!Array.isArray(d[t]))d[t]=[]});
  d.equipos.forEach(e=>{if(!e.status)e.status='Bajo'});
  d.log.forEach(l=>{if(!l.id)l.id=uid()});
  if(!d.perfil)d.perfil={nombre:''};
  if(!d.empresa)d.empresa='Ferretería Quilvio';
  delete d.usuarios;
  if(!d.batAgregado){addBaterias(d);d.batAgregado=true}
  d.seq=Math.max(d.seq||1000,...d.ots.map(o=>parseInt(String(o.num).replace(/\D/g,''))||0));
  return d;
}

function CFG(){const c=JSON.parse(localStorage.getItem('mp_nube')||'{}');return {url:(NUBE_URL||c.url||'').trim().replace(/\/+$/,''),key:(NUBE_KEY||c.key||'').trim()}}
let SES=JSON.parse(localStorage.getItem('mp_ses')||'null');
let VER=0,BASE=null,SUCIO=false,SUBIENDO=false,TIMER=null,REINT=null,ESPERA=[],COLA=Promise.resolve(),ESTADO='ok',PENDREF=false;

async function sb(path,opt={},auth=true){
  const c=CFG(),h={apikey:c.key,'Content-Type':'application/json',...(opt.headers||{})};
  const hacer=async()=>{if(auth){await asegurarToken();h.Authorization='Bearer '+SES.access_token}return fetch(c.url+path,{...opt,headers:h,cache:'no-store'})};
  let r=await hacer();
  if(r.status===401&&auth&&SES){await refrescarToken();r=await hacer()}
  if(!r.ok){let m='';try{const j=await r.json();m=j.error_description||j.msg||j.message||j.error||''}catch(e){}
    const err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err}
  if(r.status===204)return null;
  const t=await r.text();return t?JSON.parse(t):null;
}
function guardarSes(j){
  SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,
       uid:(j.user&&j.user.id)||(SES&&SES.uid),email:(j.user&&j.user.email)||(SES&&SES.email)};
  localStorage.setItem('mp_ses',JSON.stringify(SES));
}
async function asegurarToken(){if(!SES)throw Object.assign(new Error('Sin sesión'),{status:401});if(Date.now()>SES.expires_at-60000)await refrescarToken()}
let REFP=null;
function refrescarToken(){
  if(!REFP)REFP=sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:SES.refresh_token})},false)
    .then(guardarSes).finally(()=>REFP=null);
  return REFP;
}
const cargarNube=async()=>(await sb('/rest/v1/manteni?select=data,version,updated_at&user_id=eq.'+SES.uid))[0]||null;
function cacheLocal(){try{localStorage.setItem('mp_cache_'+SES.uid,JSON.stringify({data:DB,ver:VER,base:BASE,sucio:SUCIO}))}catch(e){console.warn('cache',e)}}

function estadoNube(s){

  const m={ok:['t-v','☁️ Guardado en la nube'],pend:['t-a','⏳ Guardando…'],off:['t-r','🔴 Sin conexión – se guardará al reconectar']}[s];

/* Guardado: se agrupan los cambios y se suben a la nube */
function save(){
  if(!SES||!DB)return Promise.resolve(false);
  SUCIO=true;cacheLocal();estadoNube('pend');clearTimeout(TIMER);
  return new Promise(res=>{ESPERA.push(res);TIMER=setTimeout(()=>{const w=ESPERA;ESPERA=[];COLA=COLA.then(subir).then(ok=>w.forEach(f=>f(ok)))},500)});
}
async function subir(){
  if(!SUCIO||!SES)return true;
  SUBIENDO=true;SUCIO=false;const enviado=clon(DB),ahora=new Date().toISOString();
  try{
    let r=await sb(`/rest/v1/manteni?user_id=eq.${SES.uid}&version=eq.${VER}`,{method:'PATCH',headers:{Prefer:'return=representation'},
      body:JSON.stringify({data:enviado,version:VER+1,updated_at:ahora})});
    if(r&&r.length){VER++;BASE=enviado;espejo(enviado)}
    else{
      const n=await cargarNube();
      if(!n){
        await sb('/rest/v1/manteni',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:SES.uid,data:enviado,version:1,updated_at:ahora})});
        VER=1;BASE=enviado;espejo(enviado);
      }else{
        /* Otro dispositivo guardó antes: se combinan los cambios */
        const f=fusionar(normalizar(n.data),enviado,BASE||{equipos:[],planes:[],ots:[],log:[]});
        r=await sb(`/rest/v1/manteni?user_id=eq.${SES.uid}&version=eq.${n.version}`,{method:'PATCH',headers:{Prefer:'return=representation'},
          body:JSON.stringify({data:f,version:n.version+1,updated_at:ahora})});
        if(!r||!r.length)throw Object.assign(new Error('conflicto'),{status:409});
        VER=n.version+1;espejo(f);
        DB=fusionar(f,DB,enviado);BASE=f;
        if(JSON.stringify(DB)!==JSON.stringify(f))SUCIO=true;
        aplicarLogo();refrescar();
      }
    }
    cacheLocal();SUBIENDO=false;
    if(SUCIO)save();else estadoNube('ok');
    return true;
  }catch(e){
    console.warn('No se pudo guardar en la nube',e);
    SUCIO=true;SUBIENDO=false;cacheLocal();estadoNube('off');
    if(e.status===401||e.status===400&&/refresh/i.test(e.message)){toast('La sesión expiró. Vuelva a iniciar sesión.','#c62828')}
    clearTimeout(REINT);REINT=setTimeout(()=>{if(SUCIO)save()},15000);
    return false;
  }
}
/* Combina: datos remotos + cambios locales hechos desde la última sincronización (base) */
function fusionar(rem,loc,base){
  const out=clon(rem);
  ['equipos','planes','ots'].forEach(t=>{
    const b=Object.fromEntries((base[t]||[]).map(x=>[x.id,JSON.stringify(x)])),l=new Set(loc[t].map(x=>x.id));
    loc[t].forEach(x=>{if(b[x.id]!==JSON.stringify(x)){const i=out[t].findIndex(y=>y.id===x.id);if(i>=0)out[t][i]=clon(x);else out[t].push(clon(x))}});
    Object.keys(b).forEach(id=>{if(!l.has(id))out[t]=out[t].filter(y=>y.id!==id)});
  });
  const ids=new Set(out.log.map(x=>x.id)),bl=new Set((base.log||[]).map(x=>x.id));
  out.log=loc.log.filter(x=>!ids.has(x.id)&&!bl.has(x.id)).concat(out.log).slice(0,3000);
  ['wa','logo','empresa','perfil'].forEach(k=>{if(JSON.stringify(loc[k])!==JSON.stringify(base[k]))out[k]=clon(loc[k]??null)});
  /* Una sola OT abierta por plan PM */
  const remIds=new Set(rem.ots.map(o=>o.id)),vistos={};
  out.ots=out.ots.filter(o=>{if(!o.planId||o.estado==='Completada')return true;
    if(vistos[o.planId]){return !remIds.has(o.id)?false:true}vistos[o.planId]=1;return true});
  /* Números de OT únicos */
  let mx=Math.max(1000,...out.ots.map(o=>parseInt(String(o.num).replace(/\D/g,''))||0));const usados=new Set();
  out.ots.forEach(o=>{if(usados.has(o.num))o.num='F'+(++mx);usados.add(o.num)});
  out.seq=Math.max(mx,out.seq||0,loc.seq||0);
  return out;
}
/* Revisa si otro dispositivo cambió los datos */
async function revisarNube(){
  if(!SES||!DB||SUCIO||SUBIENDO)return;
  try{
    const r=await sb('/rest/v1/manteni?select=version&user_id=eq.'+SES.uid);
    if(r[0]&&r[0].version>VER){

      if(U)U.nombre=DB.perfil.nombre||SES.email.split('@')[0];
      refrescar();toast('🔄 Datos actualizados desde otro dispositivo','#1565c0');
    }

  }catch(e){estadoNube('off')}
}

/* Datos de versiones anteriores guardados en este equipo (para subirlos la primera vez) */
async function datosLocalesAntiguos(){
  try{
    const d=await new Promise((res)=>{const r=indexedDB.open('ManteniProDB');r.onerror=()=>res(null);
      r.onsuccess=()=>{const db=r.result;if(!db.objectStoreNames.contains('equipos')){db.close();return res(null)}
        const ts=['equipos','planes','ots','log','config'].filter(t=>db.objectStoreNames.contains(t)),tx=db.transaction(ts),o={};let n=0;
        ts.forEach(t=>{const q=tx.objectStore(t).getAll();q.onsuccess=()=>{o[t]=q.result;if(++n===ts.length){db.close();res(o)}}})}});
    if(d&&d.equipos&&d.equipos.length){const cf=Object.fromEntries((d.config||[]).map(x=>[x.k,x.v]));
      return {equipos:d.equipos,planes:d.planes||[],ots:d.ots||[],log:d.log||[],seq:cf.seq,wa:cf.wa||undefined,logo:cf.logo||undefined,empresa:cf.empresa||undefined}}
  }catch(e){}
  const o=localStorage.getItem('mantenipro_v1');return o?JSON.parse(o):null;
}
async function abrirDatos(){
  const cache=JSON.parse(localStorage.getItem('mp_cache_'+SES.uid)||'null');
  let n;
  try{await asegurarToken();n=await cargarNube()}
  catch(e){
    if((!e.status||e.status>=500)&&cache){DB=normalizar(cache.data);VER=cache.ver;BASE=cache.base||clon(DB);SUCIO=!!cache.sucio;estadoNube('off');
      setTimeout(()=>save(),15000);return}
    throw e;
  }
  if(cache&&cache.sucio&&cache.data){DB=normalizar(cache.data);VER=cache.ver;BASE=cache.base||clon(DB);estadoNube('pend');setTimeout(save,100)}
  else if(n){DB=normalizar(n.data);VER=n.version;BASE=clon(DB);estadoNube('ok')}
  else{
    const local=await datosLocalesAntiguos();
    DB=normalizar(local&&confirm('La base de datos en la nube está vacía.\n\n¿Subir los datos que ya tiene en ESTE equipo?\n\n(Cancelar = empezar con datos nuevos)')?local:seed());
    DB.log.unshift({id:uid(),f:new Date().toLocaleString(),u:'Sistema',a:'Base de datos en la nube creada'});
    await sb('/rest/v1/manteni',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:SES.uid,data:DB,version:1,updated_at:new Date().toISOString()})});
    VER=1;BASE=clon(DB);estadoNube('ok');
  }
  cacheLocal();
  if(ESTADO!=='off')espejo(DB);
}

/* ===================== TABLAS EN LA NUBE: EQUIPOS Y ÓRDENES =====================
   Además del documento principal, cada equipo y cada orden de trabajo se guarda
   como una fila en las tablas "equipos" y "ordenes" de Supabase (visibles en el
   Table Editor, exportables a CSV/Excel y consultables con SQL). */
let ESPEJO={ok:null,msg:'',ult:''},ESPQ=Promise.resolve();
const fechaN=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:null;
const numN=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
function filaEq(e){return {user_id:SES.uid,id:e.id,codigo:e.codigo||'',nombre:e.nombre||'',tipo:e.tipo||'',ubicacion:e.ubicacion||'',marca:e.marca||'',serie:e.serie||'',
  prioridad:numN(e.prioridad),status:e.status||'',estado:e.estado||''}}
function filaOT(o,d){const e=d.equipos.find(x=>x.id===o.equipoId)||{};
  return {user_id:SES.uid,id:o.id,num:o.num||'',equipo_id:o.equipoId||'',equipo_codigo:e.codigo||'',equipo_nombre:e.nombre||'',tipo:o.tipo||'',descripcion:o.descripcion||'',
  crew:o.crew||'',plan_id:o.planId||null,inicio:fechaN(o.inicio),fin:fechaN(o.fin),estado:o.estado||'',tecnico:o.tecnico||'',cierre:fechaN(o.cierre),
  horas:numN(o.horas),resultado:o.resultado||'',repuestos:o.repuestos||'',costo:numN(o.costo),notas:o.notas||'',checklist:(o.checklist||[]).join('\n')}}
function espejo(d,todo){if(!SES)return ESPQ;const c=clon(d);ESPQ=ESPQ.then(()=>espejoRun(c,todo)).catch(e=>console.warn(e));return ESPQ}
async function espejoRun(d,todo){
  const k='mp_mir_'+SES.uid,guard=localStorage.getItem(k);
  if(!guard)todo=true;
  const mir=todo?{equipos:{},ordenes:{}}:JSON.parse(guard);
  const sets={equipos:d.equipos.map(filaEq),ordenes:d.ots.map(o=>filaOT(o,d))},ahora=new Date().toISOString();
  try{
    for(const t of ['equipos','ordenes']){
      const cur={},up=[];
      sets[t].forEach(f=>{const j=JSON.stringify(f);cur[f.id]=j;if(mir[t][f.id]!==j)up.push({...f,actualizado:ahora})});
      if(todo)await sb(`/rest/v1/${t}?user_id=eq.${SES.uid}`,{method:'DELETE'});
      else{const del=Object.keys(mir[t]).filter(id=>!cur[id]);
        for(let i=0;i<del.length;i+=100)await sb(`/rest/v1/${t}?user_id=eq.${SES.uid}&id=in.(${del.slice(i,i+100).map(x=>encodeURIComponent('"'+x+'"')).join(',')})`,{method:'DELETE'})}
      for(let i=0;i<up.length;i+=500)await sb(`/rest/v1/${t}?on_conflict=user_id,id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up.slice(i,i+500))});
      mir[t]=cur;localStorage.setItem(k,JSON.stringify(mir));
    }
    ESPEJO={ok:true,msg:'',ult:new Date().toLocaleString()};
  }catch(e){
    ESPEJO={ok:false,ult:ESPEJO.ult,msg:(e.status===404||/PGRST205|does not exist|schema cache|relation/i.test(e.message))
      ?'Faltan las tablas "equipos" y "ordenes" en Supabase. Ejecute de nuevo supabase_setup.sql (SQL Editor → Run).':(e.status?e.message:'Sin conexión')};
    if(!e.status||e.status>=500){clearTimeout(espejo._t);espejo._t=setTimeout(()=>{if(DB&&SES)espejo(DB)},30000)}
  }
  if(typeof vista!=='undefined'&&vista==='bd'&&document.getElementById('b_tab')&&modal.style.display!=='flex')R.bd();
}

  if(SUCIO&&!confirm('Hay cambios que todavía no se guardaron en la nube (sin conexión).\nSi sale ahora se perderán.\n\n¿Salir de todas formas?'))return;
  try{await sb('/auth/v1/logout',{method:'POST'})}catch(e){}
  if(SES)localStorage.removeItem('mp_cache_'+SES.uid);
  localStorage.removeItem('mp_ses');location.reload();
}

const eqN=id=>(DB.equipos.find(e=>e.id===id)||{}).nombre||'¿?';
const eqO=id=>DB.equipos.find(e=>e.id===id)||{};
const prox=p=>addDias(p.ultima,p.frecuencia);
function estadoTag(d){return d<0?`<span class="tag t-r">Vencido ${-d}d</span>`:d<=7?`<span class="tag t-a">En ${d}d</span>`:`<span class="tag t-v">En ${d}d</span>`}
const prTag=p=>p>=7?'<span class="tag t-r">7 CRÍTICO</span>':'<span class="tag t-g">2 Normal</span>';
const stTag=s=>`<span class="tag st-${s||'Bajo'}">${s==='Alto'?'▲ ':s==='Medio'?'■ ':'▼ '}${s||'Bajo'}</span>`;
const FREQ=[[1,'Diario'],[7,'Semanal'],[14,'Cada 2 semanas'],[30,'Mensual'],[90,'Trimestral'],[180,'Semestral'],[365,'Anual']];
const frecTxt=d=>(FREQ.find(f=>f[0]==d)||[0,d+' días'])[1];

/* Genera OT automáticamente cuando un PM está a 7 días o menos */
function generarOTs(){
  let n=0;
  DB.planes.filter(p=>p.activo).forEach(p=>{
    if(diff(prox(p))<=7&&!DB.ots.some(o=>o.planId===p.id&&o.estado!=='Completada')){
      DB.ots.push({id:uid(),num:'F'+(++DB.seq),planId:p.id,equipoId:p.equipoId,tipo:'PM',descripcion:p.descripcion,crew:p.crew,
        inicio:addDias(prox(p),-7),fin:prox(p),estado:'Abierta',asignado:'',creada:new Date().toLocaleString()});n++}
  });
  if(n)audit(`Generadas ${n} OT de PM automáticamente`);
}

const R={};
R.dash=()=>{

  const venc=ab.filter(o=>diff(o.fin)<0),sem=ab.filter(o=>diff(o.fin)>=0&&diff(o.fin)<=7);
  const crit=ab.filter(o=>eqO(o.equipoId).prioridad>=7);
  const mes=DB.ots.filter(o=>o.estado==='Completada'&&o.cierre&&o.cierre.slice(0,7)===hoy().slice(0,7));
  const fs=DB.equipos.filter(e=>e.estado!=='Operativo');

   <div class="kpi r">Críticas abiertas<b>${crit.length}</b></div><div class="kpi v">Completadas este mes<b>${mes.length}</b></div>
   <div class="kpi">Equipos<b>${DB.equipos.length}</b></div><div class="kpi a">Equipos fuera de servicio<b>${fs.length}</b></div>

   <div class="kpi v" style="cursor:pointer" onclick="go('equipos');fst.value='Bajo';R.equipos2()">Status BAJO<b>${DB.equipos.filter(e=>e.status==='Bajo').length}</b></div></div>
   <div class="card"><div class="row"><h2 style="flex:1">⏰ Recordatorios – PM pendientes (ordenados por fecha límite)</h2>
   <button class="btn v" onclick="waResumen()">📲 Enviar resumen por WhatsApp</button><button class="btn" onclick="compartir(msgResumen(),'Alerta de Mantenimiento')">📤 Compartir</button></div>
   ${tablaOT(ab.sort((a,b)=>a.fin.localeCompare(b.fin)))}</div>`;

function tablaOT(l){
  if(!l.length)return '<p>Sin órdenes.</p>';
  return `<div class="tw"><table><tr><th>OT</th><th>Equipo</th><th>Descripción</th><th>Tipo</th><th>Crew</th><th>Prioridad</th><th>Status</th><th>Inicio</th><th>Límite</th><th>Estado</th><th></th></tr>
  ${l.map(o=>`<tr><td>${o.num}</td><td>${esc(eqN(o.equipoId))}</td><td>${esc(o.descripcion)}</td><td>${o.tipo}</td><td>${o.crew}</td><td>${prTag(eqO(o.equipoId).prioridad)}</td><td>${stTag(eqO(o.equipoId).status)}</td>
  <td>${o.inicio}</td><td>${o.fin}</td><td>${o.estado==='Completada'?'<span class="tag t-v">Completada</span>':estadoTag(diff(o.fin))+' <span class="tag t-b">'+o.estado+'</span>'}</td>
  <td style="white-space:nowrap">${o.estado!=='Completada'
    ?`<button class="btn sm v" onclick="cerrarOT('${o.id}')">Completar</button> <button class="btn sm s" title="WhatsApp" onclick="waOT('${o.id}')">📲</button> <button class="btn sm s" title="Compartir" onclick="compartirOT('${o.id}')">📤</button> <button class="btn sm r" title="Borrar" onclick="borrarOT('${o.id}')">🗑</button>`
    :`<button class="btn sm s" onclick="verOT('${o.id}')">Ver</button>`}</td></tr>`).join('')}</table></div>`;
}

function editEq(id){
  const e=DB.equipos.find(x=>x.id===id)||{codigo:'',nombre:'',tipo:'',ubicacion:'',prioridad:2,marca:'',serie:'',estado:'Operativo',status:''};
  modal_(`<h2>${id?'Editar':'Nuevo'} equipo</h2><div class="grid">
  ${[['codigo','Código'],['nombre','Nombre'],['tipo','Tipo'],['ubicacion','Ubicación'],['marca','Marca'],['serie','Serie']].map(([k,t])=>`<label>${t}<input id="e_${k}" value="${esc(e[k])}"></label>`).join('')}
  <label>Prioridad<select id="e_prioridad"><option value="2">2 – Normal</option><option value="7" ${e.prioridad>=7?'selected':''}>7 – Crítico</option></select></label>
  <label>Status (condición) <b style="color:var(--rojo)">*</b><select id="e_status"><option value="" ${e.status?'':'selected'} disabled>-- Seleccione status --</option>${STATUS.map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></label>
  <label>Estado<select id="e_estado">${['Operativo','En mantenimiento','Fuera de servicio'].map(s=>`<option ${s===e.estado?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <div class="row"><button class="btn" onclick="guardaEq('${id||''}')">Guardar</button><button class="btn s" onclick="cerrar()">Cancelar</button>
  ${id?`<button class="btn r" onclick="borraEq('${id}')">Eliminar</button>`:''}</div>`);
}
function guardaEq(id){
  const o={};['codigo','nombre','tipo','ubicacion','marca','serie','estado','status'].forEach(k=>o[k]=document.getElementById('e_'+k).value.trim());o.prioridad=+e_prioridad.value;
  if(!o.codigo||!o.nombre)return alert('Código y nombre son obligatorios');
  if(!o.status){e_status.style.border='2px solid var(--rojo)';e_status.focus();return alert('Debe seleccionar el Status del equipo: Bajo, Medio o Alto.')}
  if(DB.equipos.some(x=>x.codigo.toLowerCase()===o.codigo.toLowerCase()&&x.id!==id))return alert('Ya existe un equipo con el código '+o.codigo);
  if(id){const ant=DB.equipos.find(x=>x.id===id);if(ant.status!==o.status)DB.log.unshift({id:uid(),f:new Date().toLocaleString(),u:U.nombre,a:`Cambió status de ${o.codigo}: ${ant.status} → ${o.status}`});Object.assign(ant,o);audit('Editó equipo '+o.codigo)}
  else{DB.equipos.push({id:uid(),...o});audit('Creó equipo '+o.codigo)}
  cerrar();R.equipos();
}
function setStatus(id,v){const e=DB.equipos.find(x=>x.id===id);const a=e.status;e.status=v;audit(`Cambió status de ${e.codigo}: ${a} → ${v}`);R.equipos2()}
function borraEq(id){const e=DB.equipos.find(x=>x.id===id);
  if(!confirm(`¿Eliminar el equipo ${e.codigo} y sus planes PM?\nSus órdenes abiertas también se borrarán; el historial se conserva.`))return;
  DB.equipos=DB.equipos.filter(x=>x.id!==id);DB.planes=DB.planes.filter(p=>p.equipoId!==id);DB.ots=DB.ots.filter(o=>!(o.equipoId===id&&o.estado!=='Completada'));
  audit('Eliminó equipo '+e.codigo);cerrar();R.equipos()}

R.planes2=()=>{

};
function editPlan(id,dup,eqId){
  const src=DB.planes.find(x=>x.id===id);
  const p=src?{...src}:{equipoId:eqId||'',descripcion:'',frecuencia:30,crew:'EMT',tareas:'',ultima:hoy(),activo:true};
  if(dup){p.descripcion+=' (copia)';id=''}
  const std=FREQ.some(f=>f[0]==p.frecuencia);
  modal_(`<h2>${dup?'Duplicar':id?'Editar':'Nuevo'} plan PM</h2><div class="grid">
  <label>Equipo <b style="color:var(--rojo)">*</b><select id="p_eq"><option value="">-- Seleccione equipo --</option>${DB.equipos.map(e=>`<option value="${e.id}" ${e.id===p.equipoId?'selected':''}>${esc(e.codigo+' – '+e.nombre)}</option>`).join('')}</select></label>
  <label>Descripción <b style="color:var(--rojo)">*</b><input id="p_desc" value="${esc(p.descripcion)}"></label>
  <label>Frecuencia<select id="p_fr" onchange="p_dias.parentElement.style.display=this.value==='0'?'block':'none'">${FREQ.map(f=>`<option value="${f[0]}" ${std&&f[0]==p.frecuencia?'selected':''}>${f[1]}</option>`).join('')}<option value="0" ${std?'':'selected'}>Personalizada (días)</option></select></label>
  <label style="display:${std?'none':'block'}">Cada cuántos días<input type="number" min="1" id="p_dias" value="${p.frecuencia}"></label>
  <label>Crew<select id="p_crew">${['EMT','CONTROL','CONTRATISTA'].map(c=>`<option ${c===p.crew?'selected':''}>${c}</option>`).join('')}</select></label>
  <label>Última realización<input type="date" id="p_ult" value="${p.ultima}" max="${hoy()}"></label>
  <label>Activo<select id="p_act"><option value="1">Sí</option><option value="0" ${p.activo?'':'selected'}>No</option></select></label></div>
  <label>Tareas / checklist (una por línea)<textarea id="p_tar" rows="7">${esc(p.tareas)}</textarea></label>
  <p style="font-size:12px;color:#666" id="p_prox"></p>
  <div class="row"><button class="btn v" onclick="guardaPlan('${id||''}')">💾 Guardar</button><button class="btn s" onclick="cerrar()">Cancelar</button>
  ${id?`<button class="btn r" onclick="borraPlan('${id}')">🗑 Eliminar</button>`:''}</div>`);
  const upd=()=>{const f=p_fr.value==='0'?+p_dias.value:+p_fr.value;p_prox.textContent=f>0&&p_ult.value?'Próximo PM: '+addDias(p_ult.value,f):''};
  [p_fr,p_dias,p_ult].forEach(x=>{x.addEventListener('input',upd);x.addEventListener('change',upd)});upd();
}
function guardaPlan(id){
  const f=p_fr.value==='0'?Math.round(+p_dias.value):+p_fr.value;
  const o={equipoId:p_eq.value,descripcion:p_desc.value.trim(),frecuencia:f,crew:p_crew.value,ultima:p_ult.value,activo:p_act.value==='1',tareas:p_tar.value.split('\n').map(t=>t.trim()).filter(Boolean).join('\n')};
  if(!o.equipoId)return alert('Seleccione el equipo');
  if(!o.descripcion)return alert('Falta descripción');
  if(!(f>=1))return alert('La frecuencia debe ser de al menos 1 día');
  if(!o.ultima)return alert('Indique la fecha de última realización');
  if(id){
    const p=DB.planes.find(x=>x.id===id);Object.assign(p,o);
    DB.ots=DB.ots.filter(t=>!(t.planId===id&&t.estado!=='Completada'&&(!o.activo||diff(prox(p))>7)));
    DB.ots.filter(t=>t.planId===id&&t.estado!=='Completada').forEach(t=>Object.assign(t,{equipoId:o.equipoId,descripcion:o.descripcion,crew:o.crew,fin:prox(p),inicio:addDias(prox(p),-7)}));
    audit('Editó plan PM '+o.descripcion);
  }else{DB.planes.push({id:uid(),...o});audit('Creó plan PM '+o.descripcion+' ('+eqN(o.equipoId)+')')}
  generarOTs();cerrar();go('planes');
}
function borraPlan(id){
  const p=DB.planes.find(x=>x.id===id),ab=DB.ots.filter(t=>t.planId===id&&t.estado!=='Completada');
  if(!confirm(`¿Eliminar el plan "${p.descripcion}" de ${eqN(p.equipoId)}?`+(ab.length?`\n\nTambién se borrará(n) ${ab.length} orden(es) abierta(s) de este plan.`:'')+'\nEl historial de trabajos completados se conserva.'))return;
  DB.planes=DB.planes.filter(x=>x.id!==id);DB.ots=DB.ots.filter(t=>!(t.planId===id&&t.estado!=='Completada'));
  audit(`Eliminó plan PM ${p.descripcion} (${eqN(p.equipoId)})`);cerrar();go('planes');
}

R.ots2=()=>{const c=fcrew.value;tot.innerHTML=tablaOT(DB.ots.filter(o=>o.estado!=='Completada'&&(!c||o.crew===c)).sort((a,b)=>a.fin.localeCompare(b.fin)))};
function nuevaCorr(eid){
  modal_(`<h2>Nueva OT correctiva</h2><div class="grid">
  <label>Equipo<select id="c_eq">${DB.equipos.map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${esc(e.codigo+' – '+e.nombre)}</option>`).join('')}</select></label>
  <label>Crew<select id="c_crew"><option>EMT</option><option>CONTROL</option><option>CONTRATISTA</option></select></label>
  <label>Fecha límite<input type="date" id="c_fin" value="${hoy()}"></label></div>
  <label>Descripción de la falla<textarea id="c_desc" rows="3"></textarea></label>
  <div class="row"><button class="btn" onclick="guardaCorr()">Crear OT</button><button class="btn s" onclick="cerrar()">Cancelar</button></div>`);
}
function guardaCorr(){
  if(!c_desc.value.trim())return alert('Describa la falla');
  const o={id:uid(),num:'F'+(++DB.seq),planId:null,equipoId:c_eq.value,tipo:'CM',descripcion:c_desc.value.trim(),crew:c_crew.value,inicio:hoy(),fin:c_fin.value||hoy(),estado:'Abierta',asignado:'',creada:new Date().toLocaleString(),reporto:U.nombre};
  DB.ots.push(o);audit('Creó OT correctiva '+o.num);cerrar();go('ots');
}
function cerrarOT(id){
  const o=DB.ots.find(x=>x.id===id),p=DB.planes.find(x=>x.id===o.planId);
  const tareas=(p?p.tareas:'').split('\n').filter(Boolean);
  modal_(`<h2>Completar ${o.num} – ${esc(eqN(o.equipoId))}</h2><p>${esc(o.descripcion)}</p>

/* ---- Exportar XLSX (sin librerías) ---- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipXLSX(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const [name,txt] of files){
    const n=enc.encode(name),d=enc.encode(txt),c=crc32(d);
    const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0)]);
    parts.push(h,n,d);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
    off+=h.length+n.length+d.length;
  }
  const cs=cen.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colL(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s}
const xe=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function hojaXML(rows,anchos){
  const cols='<cols>'+anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  const data=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=colL(ci)+(ri+1),s=ri===0?' s="1"':'';
    if(v===null||v===undefined||v==='')return ri===0?`<c r="${ref}"${s}/>`:'';
    if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${s}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')+'</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${data}</sheetData><autoFilter ref="A1:${colL(rows[0].length-1)+rows.length}"/></worksheet>`;
}
function libroXLSX(hojas){
  const f=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
   ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${hojas.map((h,i)=>`<sheet name="${xe(h.n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
   ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B3D91"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf fontId="0" fillId="0" borderId="0"/><xf fontId="1" fillId="2" borderId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
   ...hojas.map((h,i)=>[`xl/worksheets/sheet${i+1}.xml`,hojaXML(h.rows,h.w)])];
  return zipXLSX(f);
}
function exportXLSX(){
  const l=document.getElementById('b_d')?filtroRegs():regs(),eqC=id=>(eqO(id).codigo||'');
  const hojas=[
   {n:'Registros',w:[12,12,16,32,8,40,11,22,8,22,26,12,40,18],rows:[['N° Registro','Fecha','Código Equipo','Equipo','Tipo','Descripción del trabajo','Crew','Técnico','Horas','Resultado','Repuestos usados','Costo repuestos ($)','Hallazgos / Notas','Registrado por'],
     ...l.map(o=>[o.num,o.cierre,eqC(o.equipoId),eqN(o.equipoId),o.tipo,o.descripcion,o.crew,o.tecnico,+o.horas||0,o.resultado,o.repuestos||'',+o.costo||0,o.notas||'',o.cerradoPor||''])]},
   {n:'Equipos',w:[16,36,22,32,14,14,10,10,18],rows:[['Código','Nombre','Tipo','Ubicación','Marca','Serie','Prioridad','Status','Estado'],...DB.equipos.map(e=>[e.codigo,e.nombre,e.tipo,e.ubicacion,e.marca,e.serie,e.prioridad,e.status,e.estado])]},
   {n:'Planes_PM',w:[16,34,48,12,12,14,14,12],rows:[['Código Equipo','Equipo','Descripción PM','Frecuencia (días)','Crew','Última realización','Próximo PM','Activo'],...DB.planes.map(p=>[eqC(p.equipoId),eqN(p.equipoId),p.descripcion,p.frecuencia,p.crew,p.ultima,prox(p),p.activo?'Sí':'No'])]},
   {n:'OT_Abiertas',w:[10,16,32,40,8,11,12,12,12],rows:[['OT','Código Equipo','Equipo','Descripción','Tipo','Crew','Inicio','Límite','Estado'],...DB.ots.filter(o=>o.estado!=='Completada').map(o=>[o.num,eqC(o.equipoId),eqN(o.equipoId),o.descripcion,o.tipo,o.crew,o.inicio,o.fin,o.estado])]}];
  bajar('ManteniPro_BaseDatos_'+hoy()+'.xlsx',libroXLSX(hojas));audit(`Exportó base de datos a Excel (${l.length} registros)`);

/* ===================== WHATSAPP ===================== */
const WA=()=>DB.wa||(DB.wa={tel:'',auto:false,apikey:'',ultimo:''});
const EMP=()=>DB.empresa||'Ferretería Quilvio';
const otTxt=o=>`• ${o.num} | ${eqN(o.equipoId)} | ${o.descripcion} | Límite ${o.fin}${diff(o.fin)<0?' ⚠️ VENCIDA '+(-diff(o.fin))+'d':''}${eqO(o.equipoId).prioridad>=7?' 🔴 CRÍTICO':''} | Status: ${eqO(o.equipoId).status||'Bajo'}`;
function msgResumen(){
  const ab=DB.ots.filter(o=>o.estado!=='Completada'&&diff(o.fin)<=7).sort((a,b)=>a.fin.localeCompare(b.fin));
  const v=ab.filter(o=>diff(o.fin)<0).length,al=DB.equipos.filter(e=>e.status==='Alto');
  return `🔧 *${EMP()} – Alerta de Mantenimiento* (${hoy()})\nVencidas: ${v} | Vencen ≤7 días: ${ab.length-v}\nEquipos status ALTO: ${al.length}${al.length?' ('+al.map(e=>e.nombre).join(', ')+')':''}\n\n`+(ab.map(otTxt).join('\n')||'Sin PM pendientes ✅');
}
function abrirWA(tel,txt){tel=(tel||'').replace(/\D/g,'');window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(txt),'_blank');audit('Envió alerta WhatsApp'+(tel?' a '+tel:''))}
function waResumen(){elegirDest(msgResumen())}
function waOT(id){elegirDest(txtOT(DB.ots.find(x=>x.id===id)))}
function elegirDest(txt){
  const cs=(WA().contactos||'').split('\n').map(l=>l.split(',')).filter(x=>x[1]&&x[1].replace(/\D/g,''));
  modal_(`<h2>📲 Enviar por WhatsApp</h2><textarea id="w_txt" rows="9">${esc(txt)}</textarea>
  <label>Enviar a<select id="w_dest"><option value="">Elegir contacto/grupo en WhatsApp</option>
  ${WA().tel?`<option value="${WA().tel}">Número predeterminado (${WA().tel})</option>`:''}
  ${cs.map(c=>`<option value="${c[1].replace(/\D/g,'')}">${esc(c[0].trim())} (${c[1].replace(/\D/g,'')})</option>`).join('')}</select></label>
  <div class="row"><button class="btn v" onclick="abrirWA(w_dest.value,w_txt.value);cerrar()">Abrir WhatsApp</button><button class="btn" onclick="compartir(w_txt.value)">📤 Otras apps</button><button class="btn s" onclick="cerrar()">Cancelar</button></div>
  <p style="font-size:12px;color:#777">Se abre WhatsApp con el mensaje listo; usted presiona Enviar.</p>`);
}
R.whats=()=>{const w=WA();
  main.innerHTML=`<div class="card"><h2>📲 Alertas por WhatsApp</h2>
  <h3>1. Envío manual (gratis)</h3><p>Use <b>📲 Enviar resumen</b> en el Dashboard o el botón 📲 en cada orden.</p>
  <label>Número predeterminado (con código país, ej. 16095551234)<input id="w_tel" value="${esc(w.tel)}"></label>
  <label>Contactos (uno por línea: Nombre, Número)<textarea id="w_con" rows="4" placeholder="Juan Pérez, 16095551111">${esc(w.contactos||'')}</textarea></label>
  <h3>2. Alerta automática diaria (opcional – CallMeBot)</h3>
  <p style="font-size:13px">Una vez al día, al abrir ManteniPro, se envía el resumen al número predeterminado. Para obtener la API key: agregue <b>+34 644 51 95 23</b> a sus contactos y envíele por WhatsApp: <code>I allow callmebot to send me messages</code>.</p>
  <div class="grid"><label>API key CallMeBot<input id="w_key" value="${esc(w.apikey)}"></label>
  <label>Alerta automática<select id="w_auto"><option value="0">Desactivada</option><option value="1" ${w.auto?'selected':''}>Activada</option></select></label></div>
  <p style="font-size:12px">Último envío automático: ${w.ultimo||'nunca'}</p>
  <div class="row"><button class="btn" onclick="guardaWA()">Guardar</button><button class="btn s" onclick="guardaWA();autoWA(true)">Enviar prueba automática</button><button class="btn v" onclick="waResumen()">Probar envío manual</button></div></div>`};
function guardaWA(){const w=WA();w.tel=w_tel.value.replace(/\D/g,'');w.contactos=w_con.value.trim();w.apikey=w_key.value.trim();w.auto=w_auto.value==='1';audit('Configuró WhatsApp');toast('✔ Guardado')}
function autoWA(forzar){const w=WA();
  if(!w.tel||!w.apikey)return forzar&&alert('Falta número predeterminado o API key');
  if(!forzar&&(!w.auto||w.ultimo===hoy()))return;
  fetch('https://api.callmebot.com/whatsapp.php?phone='+w.tel+'&apikey='+encodeURIComponent(w.apikey)+'&text='+encodeURIComponent(msgResumen()),{mode:'no-cors'})
   .then(()=>{w.ultimo=hoy();audit('Alerta automática WhatsApp enviada a '+w.tel);forzar&&alert('Enviado. Revise su WhatsApp.')})
   .catch(()=>forzar&&alert('Sin conexión a internet'));
}

/* ===================== COMPARTIR ===================== */
function txtOT(o){
  if(o.estado==='Completada')return `✅ *${EMP()} – Reporte de Mantenimiento*\nOT ${o.num} | ${eqN(o.equipoId)}\n${o.descripcion} (${o.tipo}, ${o.crew})\nRealizado por: ${o.tecnico} el ${o.cierre} · ${o.horas} h\nResultado: ${o.resultado}\nRepuestos: ${o.repuestos||'-'}\nNotas: ${o.notas||'-'}`+((o.checklist||[]).length?'\n'+o.checklist.join('\n'):'');
  return `🔧 *${EMP()} – Orden de Trabajo*\n${otTxt(o)}\nTipo: ${o.tipo} | Crew: ${o.crew}\nFavor completar y registrar en ManteniPro.`;
}
function compartirOT(id){const o=DB.ots.find(x=>x.id===id);compartir(txtOT(o),EMP()+' – '+o.num)}
let SH_AS='';
function compartir(txt,asunto){
  SH_AS=asunto||EMP()+' – Mantenimiento';
  modal_(`<h2>📤 Compartir mensaje</h2><textarea id="sh_txt" rows="9">${esc(txt)}</textarea>
  <div class="row" style="margin-top:10px">${navigator.share?'<button class="btn" onclick="shNativo()">📱 Compartir…</button>':''}
   <button class="btn v" onclick="shAbrir('wa')">📲 WhatsApp</button><button class="btn" style="background:#5b5fc7" onclick="shAbrir('teams')">💬 Teams</button>
   <button class="btn" onclick="shAbrir('mail')">✉️ Correo</button><button class="btn" onclick="shAbrir('sms')">💭 SMS</button>
   <button class="btn s" onclick="shCopiar()">📋 Copiar</button><button class="btn s" onclick="cerrar()">Cerrar</button></div>
  <p id="sh_ok" style="font-size:12px;color:var(--verde)"></p>`);
}
function shAbrir(m){
  const e=encodeURIComponent(sh_txt.value),a=encodeURIComponent(SH_AS);
  const url={wa:'https://wa.me/?text='+e,teams:'https://teams.microsoft.com/share?msgText='+e,mail:'mailto:?subject='+a+'&body='+e,sms:'sms:?&body='+e}[m];
  if(m==='mail'||m==='sms')location.href=url;else window.open(url,'_blank');
  audit('Compartió mensaje por '+{wa:'WhatsApp',teams:'Teams',mail:'Correo',sms:'SMS'}[m]);
}
async function shNativo(){try{await navigator.share({title:SH_AS,text:sh_txt.value});audit('Compartió mensaje (menú del sistema)')}catch(e){}}
async function shCopiar(){try{await navigator.clipboard.writeText(sh_txt.value)}catch(e){sh_txt.select();document.execCommand('copy')}sh_ok.textContent='✔ Copiado. Péguelo donde quiera (Ctrl+V).'}

/* ===================== POP-UP VENCIDOS ===================== */
const vencidas=()=>DB.ots.filter(o=>o.estado!=='Completada'&&diff(o.fin)<0).sort((a,b)=>(eqO(b.equipoId).prioridad||0)-(eqO(a.equipoId).prioridad||0)||a.fin.localeCompare(b.fin));
function bellVenc(){if(!DB)return;const n=vencidas().length;bellV.style.display=n?'inline-block':'none';bellV.textContent='⚠️ '+n+' vencido'+(n===1?'':'s')}
let POPF='';
function popupVencidos(forzar){
  bellVenc();
  const l=vencidas();
  if(!l.length){if(forzar)alert('✅ No hay mantenimientos vencidos.');return}
  const firma=hoy()+'|'+l.map(o=>o.id).join(',');
  if(!forzar&&localStorage.getItem('mp_popv')===firma)return;
  const crit=l.filter(o=>eqO(o.equipoId).prioridad>=7).length;
  modal_(`<h2 style="color:var(--rojo)">⚠️ Mantenimiento vencido</h2>
   <p>Hay <b>${l.length}</b> mantenimiento${l.length===1?'':'s'} vencido${l.length===1?'':'s'}${crit?` · <span class="tag t-r">${crit} CRÍTICO${crit===1?'':'S'}</span>`:''}</p>
   <div class="tw" style="max-height:45vh"><table><tr><th>OT</th><th>Equipo</th><th>Descripción</th><th>Límite</th><th>Atraso</th><th></th></tr>
   ${l.map(o=>`<tr><td>${o.num}</td><td>${esc(eqN(o.equipoId))} ${eqO(o.equipoId).prioridad>=7?'<span class="tag t-r">CRÍTICO</span>':''}</td><td>${esc(o.descripcion)}</td><td>${o.fin}</td>
   <td><span class="tag t-r">${-diff(o.fin)} día${-diff(o.fin)===1?'':'s'}</span></td><td><button class="btn sm v" onclick="cerrarOT('${o.id}')">Completar</button></td></tr>`).join('')}</table></div>
   <label style="margin-top:10px"><input type="checkbox" id="pv_hoy" style="width:auto"> No volver a mostrar hoy (salvo que venza otro mantenimiento)</label>
   <div class="row"><button class="btn" onclick="cerrarPopV();go('ots')">📋 Ver órdenes</button><button class="btn v" onclick="cerrarPopV();waResumen()">📲 Avisar por WhatsApp</button>
   <button class="btn s" onclick="cerrarPopV();compartir(msgResumen(),'Mantenimiento vencido')">📤 Compartir</button><button class="btn s" onclick="cerrarPopV()">Cerrar</button></div>`);
  const c=document.querySelector('#modal .card');c.classList.add('alerta-v');c.style.maxWidth='860px';POPF=firma;
}
function cerrarPopV(){if(document.getElementById('pv_hoy')&&pv_hoy.checked)localStorage.setItem('mp_popv',POPF);cerrar()}

/* ===================== RESPALDO / EMPRESA ===================== */
R.datos=()=>{main.innerHTML=`<div class="card"><h2>💾 Respaldo de datos</h2>
  <p>Los datos se guardan automáticamente en la <b>nube</b> y se pueden abrir desde cualquier equipo con su correo y contraseña. Además, descargue un respaldo de vez en cuando.</p>
  <div class="row"><button class="btn" onclick="bajar('mantenipro_respaldo_'+hoy()+'.json',JSON.stringify(DB,null,1),'application/json');audit('Exportó respaldo')">⬇ Descargar respaldo (JSON)</button>
  <label class="btn s" style="margin:0">⬆ Restaurar respaldo<input type="file" accept=".json" style="display:none" onchange="importar(this)"></label>
  <button class="btn r" onclick="borrarBD()">Reiniciar sistema</button></div></div>
  <div class="card"><h2>🏷️ Empresa y logo</h2>
  <div class="row" style="align-items:flex-start;gap:20px"><img src="${DB.logo||LOGO_FULL}" style="max-width:160px;max-height:170px;border:1px solid var(--borde);border-radius:8px;padding:6px;background:#fff">
  <div style="flex:1;min-width:240px"><label>Nombre de la empresa<input id="cf_emp" value="${esc(EMP())}"></label>
  <div class="row"><button class="btn" onclick="guardaEmpresa()">💾 Guardar nombre</button>
  <label class="btn s" style="margin:0">🖼️ Cambiar logo<input type="file" accept="image/*" style="display:none" onchange="subirLogo(this)"></label>
  ${DB.logo?'<button class="btn s" onclick="logoOriginal()">↺ Logo original</button>':''}</div>
  <p style="font-size:12px;color:#666">PNG o JPG; se recomienda fondo transparente.</p></div></div></div>`};
function importar(inp){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.equipos)throw 0;
  if(!confirm('¿Reemplazar TODOS los datos de la nube por los del respaldo?'))return;
  DB=normalizar(d);aplicarLogo();audit('Restauró respaldo');alert('Respaldo restaurado');go('dash')}catch(e){alert('Archivo inválido')}};r.readAsText(inp.files[0])}
function borrarBD(){
  if(!confirm('¿Borrar TODOS los datos (equipos, planes, órdenes e historial) de la nube y empezar de nuevo?\n\nDescargue un respaldo antes.'))return;
  if(prompt('Escriba BORRAR para confirmar')!=='BORRAR')return;
  const keep={empresa:DB.empresa,logo:DB.logo,perfil:DB.perfil,wa:DB.wa};DB=Object.assign(seed(),keep);audit('Reinició el sistema');go('dash');
}
function guardaEmpresa(){const v=cf_emp.value.trim();if(!v)return alert('Escriba el nombre');DB.empresa=v;aplicarLogo();audit('Cambió nombre de empresa a '+v);toast('✔ Nombre guardado');R.datos()}
function subirLogo(inp){const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return alert('Seleccione una imagen');
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,300/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);DB.logo=c.toDataURL('image/png');aplicarLogo();audit('Cambió el logo');toast('✔ Logo guardado');R.datos()};
    img.onerror=()=>alert('No se pudo leer la imagen');img.src=r.result};r.readAsDataURL(f)}
function logoOriginal(){delete DB.logo;aplicarLogo();audit('Restauró logo original');R.datos()}

/* ===================== MI CUENTA ===================== */
function miCuenta(){
  modal_(`<h2>👤 Mi cuenta</h2>
  <label>Correo<input value="${esc(SES.email)}" disabled></label>
  <label>Nombre (aparece en órdenes y auditoría)<input id="mc_n" value="${esc(DB.perfil.nombre||'')}" placeholder="${esc(U.nombre)}"></label>
  <div class="row"><button class="btn" onclick="guardaNombre()">💾 Guardar nombre</button></div>
  <div class="card" style="background:#f8fafc"><b>🔑 Cambiar contraseña</b>
  <label>Contraseña actual<input type="password" id="m_a" autocomplete="current-password"></label>
  <div class="grid"><label>Nueva contraseña<input type="password" id="m_p" autocomplete="new-password">${ojo('m_p')}</label><label>Confirmar nueva<input type="password" id="m_p2" autocomplete="new-password"></label></div>
  <p style="font-size:12px;color:#666">Mínimo 8 caracteres, con letras y números.</p>
  <button class="btn v" id="m_btn" onclick="guardaMiPass()">💾 Cambiar contraseña</button></div>
  <div class="row"><button class="btn s" onclick="cerrar()">Cerrar</button></div>`);
}
function guardaNombre(){DB.perfil.nombre=mc_n.value.trim();U.nombre=DB.perfil.nombre||SES.email.split('@')[0];who.textContent=U.nombre;audit('Cambió su nombre a '+U.nombre);toast('✔ Nombre guardado')}
async function guardaMiPass(){
  const e=reglaPass(m_p.value,m_p2.value);if(e)return alert(e);
  if(m_p.value===m_a.value)return alert('La nueva contraseña debe ser diferente a la actual.');
  m_btn.disabled=true;
  try{
    try{guardarSes(await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:SES.email,password:m_a.value})},false))}
    catch(x){if(x.status===400)throw new Error('La contraseña actual no es correcta.');throw x}
    await sb('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:m_p.value})});
    audit('Cambió su contraseña');cerrar();toast('✔ Contraseña cambiada');
  }catch(x){alert(x.status?'No se pudo cambiar: '+x.message:x.message||'Sin conexión con la nube.')}
  if(document.getElementById('m_btn'))m_btn.disabled=false;
}

/* ===================== ARRANQUE ===================== */
(async()=>{
  aplicarLogo();
  const c=CFG();
  if(!c.url||!c.key){mostrarLogin('cfg');return}
  mostrarLogin('login');
  if(SES){
    lu.value=SES.email||'';
    try{await abrirDatos();entrar()}
    catch(e){if(e.status===400||e.status===401){SES=null;localStorage.removeItem('mp_ses');loginMsg.textContent='La sesión expiró. Inicie sesión de nuevo.'}
      else loginMsg.textContent='No hay conexión con la nube. Revise internet.'}
  }
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
