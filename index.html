<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0b3d91">
<title>ManteniPro v1.7.0 - Mantenimiento de Equipos</title>
<style>
:root{--azul:#0b3d91;--azul2:#1565c0;--rojo:#c62828;--ama:#f9a825;--verde:#2e7d32;--gris:#f3f5f9;--borde:#d5dbe5}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--gris);color:#1d2433}
header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header span{font-size:13px;opacity:.9}
nav{display:flex;gap:4px;flex-wrap:wrap;background:#fff;padding:6px 10px;border-bottom:1px solid var(--borde)}
nav button{background:none;border:none;padding:8px 12px;cursor:pointer;border-radius:6px;font-size:14px}
nav button.act{background:var(--azul2);color:#fff}
main{padding:16px;max-width:1300px;margin:auto}
.card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;padding:14px;border-left:6px solid var(--azul2)}
.kpi b{font-size:28px;display:block}.kpi.r{border-color:var(--rojo)}.kpi.a{border-color:var(--ama)}.kpi.v{border-color:var(--verde)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
th{background:#e8edf6;position:sticky;top:0}.tw{overflow:auto;max-height:520px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.t-r{background:var(--rojo)}.t-a{background:var(--ama);color:#000}.t-v{background:var(--verde)}.t-g{background:#78849e}.t-b{background:var(--azul2)}.st-Bajo{background:var(--verde)}.st-Medio{background:var(--ama);color:#000}.st-Alto{background:var(--rojo)}
input,select,textarea{padding:7px;border:1px solid var(--borde);border-radius:6px;font-size:14px;width:100%}
label{font-size:12px;color:#4a5568;display:block;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.btn{background:var(--azul2);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.btn.s{background:#fff;color:var(--azul2);border:1px solid var(--azul2)}.btn.r{background:var(--rojo)}.btn.v{background:var(--verde)}.btn.sm{padding:4px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#login{max-width:360px;margin:80px auto}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
.modal .card{width:100%;max-width:620px;max-height:92vh;overflow:auto}
.hide{display:none}h2{margin:4px 0 12px;font-size:18px}
.alerta-v{border:4px solid var(--rojo);animation:pop .25s ease-out,parpadeo 2s ease-in-out .25s infinite}
.alerta-v h2{animation:parpadeoTxt 2s ease-in-out infinite}
@keyframes parpadeo{0%,100%{border-color:var(--rojo);box-shadow:0 0 0 0 rgba(198,40,40,.0);background:#fff}
 50%{border-color:#ff5252;box-shadow:0 0 28px 8px rgba(198,40,40,.75);background:#ffebee}}
@keyframes parpadeoTxt{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.alerta-v,.alerta-v h2{animation:none}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#bellV{animation:parpadeoTxt 2s ease-in-out infinite;background:var(--rojo);color:#fff;border:none;border-radius:14px;padding:3px 10px;cursor:pointer;font-weight:bold;display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card">
  <h2>🔧 ManteniPro</h2>
  <label>Usuario<input id="lu" autocomplete="username"></label>
  <label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label>
  <button class="btn" onclick="login()">Entrar</button>
  <p style="font-size:12px;color:#777">Primer uso: <b>admin</b> / <b>admin123</b> (el sistema le pedirá cambiarla)</p>
</div>

<div id="app" class="hide">
<header><h1>🔧 ManteniPro – Mantenimiento de Equipos <small style="font-size:11px;opacity:.7">v1.7.0</small></h1><button id="bellV" title="Mantenimientos vencidos" onclick="popupVencidos(true)"></button><span id="who"></span><button class="btn s sm" onclick="cambiarPass(false)">🔑 Mi contraseña</button><button class="btn s sm" onclick="logout()">Salir</button></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<div class="modal" id="modal"><div class="card" id="mbody"></div></div>

<script>
/* ===================== DATOS ===================== */
const K='mantenipro_v1';
let DB=null;
const hoy=()=>new Date().toISOString().slice(0,10);
const addDias=(f,d)=>{const x=new Date(f+'T00:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
const diff=f=>Math.round((new Date(f+'T00:00:00')-new Date(hoy()+'T00:00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ===== BASE DE DATOS INTERNA (IndexedDB) ===== */
const DBNAME='ManteniProDB',TABLAS=['equipos','planes','ots','usuarios','log','config'];
let IDB=null,ULTIMO_GUARDADO='';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);
  r.onupgradeneeded=()=>{const d=r.result;
    ['equipos','planes','ots','usuarios'].forEach(t=>{if(!d.objectStoreNames.contains(t))d.createObjectStore(t,{keyPath:'id'})});
    if(!d.objectStoreNames.contains('log'))d.createObjectStore('log');
    if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'k'});
    d.objectStoreNames.contains('ots')&&r.transaction.objectStore('ots').createIndex('equipoId','equipoId');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej('bloqueada')})}
async function idbLoad(){
  IDB=await idbOpen();const tx=IDB.transaction(TABLAS,'readonly');
  const g=t=>new Promise((r,j)=>{const q=tx.objectStore(t).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
  const [equipos,planes,ots,usuarios,log,config]=await Promise.all(TABLAS.map(g));
  if(!usuarios.length) return null;
  const cf=Object.fromEntries(config.map(x=>[x.k,x.v]));ULTIMO_GUARDADO=cf.guardado||'';
  return {equipos,planes,ots,usuarios,log,seq:cf.seq||1000,wa:cf.wa||undefined};
}
function save(){
  if(!IDB){try{localStorage.setItem(K,JSON.stringify(DB));return Promise.resolve(true)}catch(e){alert('No se pudo guardar: '+e);return Promise.resolve(false)}}
  const tx=IDB.transaction(TABLAS,'readwrite');
  ['equipos','planes','ots','usuarios'].forEach(t=>{const st=tx.objectStore(t);st.clear();DB[t].forEach(x=>st.put(x))});
  const l=tx.objectStore('log');l.clear();DB.log.forEach((x,i)=>l.put(x,i));
  ULTIMO_GUARDADO=new Date().toLocaleString();
  const c=tx.objectStore('config');c.put({k:'seq',v:DB.seq});c.put({k:'wa',v:DB.wa||null});c.put({k:'guardado',v:ULTIMO_GUARDADO});
  return new Promise(res=>{tx.oncomplete=()=>res(true);tx.onerror=()=>{alert('Error al guardar en la base de datos: '+tx.error);res(false)}});
}
function borrarBD(){
  if(!confirm('¿Borrar TODA la base de datos y reiniciar? Haga un respaldo antes.'))return;
  if(IDB)IDB.close();const r=indexedDB.deleteDatabase(DBNAME);
  const fin=()=>{localStorage.removeItem(K);sessionStorage.clear();location.reload()};r.onsuccess=fin;r.onerror=fin;r.onblocked=fin;
}
const listo=(async()=>{
  try{DB=await idbLoad()}catch(e){IDB=null;console.warn('IndexedDB no disponible, se usa localStorage',e)}
  let migrado=false;
  if(!DB){const old=localStorage.getItem(K);if(old){DB=JSON.parse(old);migrado=true}}
  if(!DB){await seed()}
  addBaterias();DB.equipos.forEach(e=>{if(!e.status)e.status='Bajo'});
  if(migrado&&IDB){DB.log.unshift({f:new Date().toLocaleString(),u:'Sistema',a:'Datos migrados a la base de datos interna (IndexedDB)'});
    localStorage.setItem(K+'_respaldo_migracion',localStorage.getItem(K));localStorage.removeItem(K)}
  save();
  try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}
})();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function seed(){
  const eq=[['CAPPER1','Capper 1','Capper','FLR – Línea Llenado',2],['CAPPER2','Capper 2','Capper','FLR – Línea Llenado',2],
   ['SPINSCAN1','Spin Scan 1','Spin Scan','FLR – Inspección',2],['WS9','Wrap Seal 9','Wrap Seal','FLR – Empaque',7],
   ['BOTTLEHOPPER1','Bottle Hopper 1 (120cc)','Bottle Hopper','FLR – Alimentación',7],['ETCHER1','Etcher Station 1','Etcher','FLR – Etiquetado',2],
   ['INSPECT1','Inspect Station 1','Cámara Cognex','FLR – Inspección',2],['MAILSORTER','Mail Sorter','Sorter','FLR – Envíos',7],
   ['ROBOT1','Robot Omron Viper 650','Robot','FLR – Celda 1',7],['PCM1','Pallet Conveyor Motors HVF 7-9','Conveyor','FLR – HVF',7]];
  DB={equipos:[],planes:[],ots:[],usuarios:[],log:[],seq:1000};
  eq.forEach(([cod,n,t,u,p])=>DB.equipos.push({id:uid(),codigo:cod,nombre:n,tipo:t,ubicacion:u,prioridad:p,marca:'',serie:'',estado:'Operativo',status:'Bajo'}));
  const pl=[[0,'Capper Clean',14,'EMT','Limpieza general\nRevisar cabezales\nVerificar torque'],[1,'Capper Clean',14,'EMT','Limpieza general\nRevisar cabezales\nVerificar torque'],
   [2,'Spin Scan PM',14,'EMT','Limpiar lentes\nVerificar lectura\nRevisar rodillos'],[3,'Wrap Seal Quarterly – CRITICAL',90,'EMT','Inspeccionar fold tool\nRevisar vacío\nLimpiar sellador'],
   [4,'Bottle Hopper PM – CRITICAL',14,'EMT','Revisar alimentación\nLimpiar tolva\nVerificar sensores'],[5,'Etcher Maintenance',14,'EMT','Limpiar óptica\nRevisar extracción'],
   [6,'Inspección Cámara Cognex',30,'CONTROL','Limpiar lente\nVerificar iluminación\nRespaldo de job'],[7,'End of Shift Inspection',1,'CONTROL','Inspección visual\nRevisar atascos'],
   [8,'Robot PM / Calibración',180,'CONTROL','Respaldo de programa\nVerificar calibración\nRevisar cables y grasa'],[9,'Motor/LTU/Belt Monthly – CRITICAL',30,'EMT','Revisar motores\nTensión de bandas\nRuido/vibración']];
  pl.forEach(([i,d,f,c,t])=>DB.planes.push({id:uid(),equipoId:DB.equipos[i].id,descripcion:d,frecuencia:f,crew:c,tareas:t,ultima:addDias(hoy(),-f+((i%4)-1)*3),activo:true}));
  DB.usuarios.push({id:uid(),usuario:'admin',nombre:'Administrador',rol:'Admin',pass:await hash('admin123'),activo:true,debeCambiar:true,creado:hoy()});
  save();
}

/* ===================== SESIÓN ===================== */
let U=null;
async function login(){
  await listo;
  const u=DB.usuarios.find(x=>x.usuario.toLowerCase()===lu.value.trim().toLowerCase());
  if(!u||!(await passOK(u,lp.value))) return alert('Usuario o contraseña incorrectos');
  if(u.activo===false) return alert('Este usuario está desactivado. Contacte al administrador.');
  if(lp.value==='admin123')u.debeCambiar=true;
  U=u;u.ultimoAcceso=new Date().toLocaleString();sessionStorage.setItem('mp_u',u.id);lp.value='';audit('Inicio de sesión');start();
  if(u.debeCambiar) setTimeout(()=>cambiarPass(true),50);
}
function logout(){sessionStorage.removeItem('mp_u');location.reload()}
function audit(a){DB.log.unshift({f:new Date().toLocaleString(),u:U?U.nombre:'-',a});DB.log=DB.log.slice(0,2000);save()}
const puede=r=>({Admin:3,Supervisor:2,'Técnico':1}[U.rol]>=r);

/* ===================== NAVEGACIÓN ===================== */
const VISTAS=[['dash','📊 Dashboard',1],['equipos','🏭 Equipos',1],['planes','🗓️ Planes PM',1],['ots','📋 Órdenes de Trabajo',1],['hist','📚 Historial',1],['bd','🗄️ Base de Datos',1],['usuarios','👥 Usuarios',3],['whats','📲 WhatsApp',2],['datos','💾 Respaldo',2],['audit','🔒 Auditoría',3]];
let vista='dash';
function start(){
  document.getElementById('login').classList.add('hide');app.classList.remove('hide');
  who.textContent=U.nombre+' ('+U.rol+')';generarOTs();autoWA(false);go('dash');popupVencidos(false);setInterval(()=>{generarOTs();bellVenc();if(modal.style.display!=='flex')popupVencidos(false)},30*60*1000);
}
function go(v){vista=v;setTimeout(bellVenc,0);nav.innerHTML=VISTAS.filter(x=>puede(x[2])).map(x=>`<button class="${x[0]===v?'act':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');R[v]()}
const eqN=id=>(DB.equipos.find(e=>e.id===id)||{}).nombre||'¿?';
const eqO=id=>DB.equipos.find(e=>e.id===id)||{};
const prox=p=>addDias(p.ultima,p.frecuencia);
function estadoTag(d){return d<0?`<span class="tag t-r">Vencido ${-d}d</span>`:d<=7?`<span class="tag t-a">En ${d}d</span>`:`<span class="tag t-v">En ${d}d</span>`}
const STATUS=['Bajo','Medio','Alto'];
const stTag=s=>`<span class="tag st-${s||'Bajo'}">${s==='Alto'?'▲ ':s==='Medio'?'■ ':'▼ '}${s||'Bajo'}</span>`;
const prTag=p=>p>=7?'<span class="tag t-r">7 CRÍTICO</span>':'<span class="tag t-g">2 Normal</span>';

/* Genera OT automáticamente cuando un PM está a 7 días o menos */
function generarOTs(){
  let n=0;
  DB.planes.filter(p=>p.activo).forEach(p=>{
    if(diff(prox(p))<=7 && !DB.ots.some(o=>o.planId===p.id&&o.estado!=='Completada')){
      DB.ots.push({id:uid(),num:'F'+(++DB.seq),planId:p.id,equipoId:p.equipoId,tipo:'PM',descripcion:p.descripcion,crew:p.crew,
        inicio:addDias(prox(p),-7),fin:prox(p),estado:'Abierta',asignado:'',creada:new Date().toLocaleString()});n++}
  });
  if(n){audit(`Generadas ${n} OT de PM automáticamente`);}
}

/* ===================== VISTAS ===================== */
const R={};
R.dash=()=>{
  const ab=DB.ots.filter(o=>o.estado!=='Completada');
  const venc=ab.filter(o=>diff(o.fin)<0), sem=ab.filter(o=>diff(o.fin)>=0&&diff(o.fin)<=7);
  const crit=ab.filter(o=>eqO(o.equipoId).prioridad>=7);
  const mes=DB.ots.filter(o=>o.estado==='Completada'&&o.cierre&&o.cierre.slice(0,7)===hoy().slice(0,7));
  const fs=DB.equipos.filter(e=>e.estado!=='Operativo');
  main.innerHTML=`<div class="kpis">
   <div class="kpi r">Vencidas<b>${venc.length}</b></div><div class="kpi a">Vencen ≤7 días<b>${sem.length}</b></div>
   <div class="kpi r">Críticas abiertas<b>${crit.length}</b></div><div class="kpi v">Completadas este mes<b>${mes.length}</b></div>
   <div class="kpi">Equipos<b>${DB.equipos.length}</b></div><div class="kpi a">Equipos fuera de servicio<b>${fs.length}</b></div>
   <div class="kpi r" style="cursor:pointer" onclick="go('equipos');fst.value='Alto';R.equipos2()">Status ALTO<b>${DB.equipos.filter(e=>e.status==='Alto').length}</b></div>
   <div class="kpi a" style="cursor:pointer" onclick="go('equipos');fst.value='Medio';R.equipos2()">Status MEDIO<b>${DB.equipos.filter(e=>e.status==='Medio').length}</b></div>
   <div class="kpi v" style="cursor:pointer" onclick="go('equipos');fst.value='Bajo';R.equipos2()">Status BAJO<b>${DB.equipos.filter(e=>(e.status||'Bajo')==='Bajo').length}</b></div></div>
   <div class="card"><div class="row"><h2 style="flex:1">⏰ Recordatorios – PM pendientes (ordenados por fecha límite)</h2><button class="btn v" onclick="waResumen()">📲 Enviar resumen por WhatsApp</button><button class="btn" onclick="compartir(msgResumen(),'Alerta de Mantenimiento')">📤 Compartir</button></div>${tablaOT(ab.sort((a,b)=>a.fin.localeCompare(b.fin)))}</div>`;
};
function tablaOT(l){
  if(!l.length) return '<p>Sin órdenes.</p>';
  return `<div class="tw"><table><tr><th>OT</th><th>Equipo</th><th>Descripción</th><th>Tipo</th><th>Crew</th><th>Prioridad</th><th>Status</th><th>Inicio</th><th>Límite</th><th>Estado</th><th>Asignado</th><th></th></tr>
  ${l.map(o=>`<tr><td>${o.num}</td><td>${esc(eqN(o.equipoId))}</td><td>${esc(o.descripcion)}</td><td>${o.tipo}</td><td>${o.crew}</td><td>${prTag(eqO(o.equipoId).prioridad)}</td><td>${stTag(eqO(o.equipoId).status)}</td>
  <td>${o.inicio}</td><td>${o.fin}</td><td>${o.estado==='Completada'?'<span class="tag t-v">Completada</span>':estadoTag(diff(o.fin))+' <span class="tag t-b">'+o.estado+'</span>'}</td>
  <td>${esc(o.asignado)}</td><td>${o.estado!=='Completada'?`<button class="btn sm v" onclick="cerrarOT('${o.id}')">Completar</button> <button class="btn sm s" title="WhatsApp" onclick="waOT('${o.id}')">📲</button> <button class="btn sm s" title="Compartir" onclick="compartirOT('${o.id}')">📤</button>${puede(2)?` <button class="btn sm r" title="Borrar" onclick="borrarOT('${o.id}')">🗑</button>`:''}`:`<button class="btn sm s" onclick="verOT('${o.id}')">Ver</button> <button class="btn sm s" title="Compartir" onclick="compartirOT('${o.id}')">📤</button>${puede(3)?` <button class="btn sm r" title="Borrar" onclick="borrarOT('${o.id}')">🗑</button>`:''}`}</td></tr>`).join('')}</table></div>`;
}

R.equipos=()=>{
  main.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1">Equipos</h2><select id="fst" style="max-width:150px" onchange="R.equipos2()"><option value="">Todos los status</option>${STATUS.map(s=>`<option>${s}</option>`).join('')}</select><input id="fq" placeholder="Buscar..." style="max-width:220px" oninput="R.equipos2()">
  ${puede(2)?'<button class="btn" onclick="editEq()">+ Nuevo equipo</button>':''}</div><div id="tq"></div></div>`;R.equipos2();
};
R.equipos2=()=>{
  const q=(fq.value||'').toLowerCase();
  const fs=fst.value;const l=DB.equipos.filter(e=>JSON.stringify(e).toLowerCase().includes(q)&&(!fs||e.status===fs)).sort((a,b)=>STATUS.indexOf(b.status)-STATUS.indexOf(a.status));
  tq.innerHTML=`<div class="tw"><table><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Ubicación</th><th>Prioridad</th><th>Status</th><th>Estado</th><th>Próximo PM</th><th></th></tr>
  ${l.map(e=>{const ps=DB.planes.filter(p=>p.equipoId===e.id&&p.activo).map(prox).sort();return `<tr><td>${esc(e.codigo)}</td><td>${esc(e.nombre)}</td><td>${esc(e.tipo)}</td><td>${esc(e.ubicacion)}</td>
  <td>${prTag(e.prioridad)}</td><td>${puede(1)?`<select class="stsel" style="width:auto;padding:3px" onchange="setStatus('${e.id}',this.value)">${STATUS.map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select>`:''} ${stTag(e.status)}</td><td>${esc(e.estado)}</td><td>${ps[0]?ps[0]+' '+estadoTag(diff(ps[0])):'-'}</td>
  <td><button class="btn sm s" onclick="histEq('${e.id}')">Historial</button> <button class="btn sm s" onclick="nuevaCorr('${e.id}')">Falla/OT</button>${puede(2)?` <button class="btn sm s" onclick="editPlan(null,false,'${e.id}')">+ Plan PM</button>`:''}
  ${puede(2)?`<button class="btn sm" onclick="editEq('${e.id}')">Editar</button>`:''}</td></tr>`}).join('')}</table></div>`;
};
function editEq(id){
  const e=DB.equipos.find(x=>x.id===id)||{codigo:'',nombre:'',tipo:'',ubicacion:'',prioridad:2,marca:'',serie:'',estado:'Operativo',status:''};
  modal_(`<h2>${id?'Editar':'Nuevo'} equipo</h2><div class="grid">
  ${['codigo','nombre','tipo','ubicacion','marca','serie'].map(k=>`<label>${k[0].toUpperCase()+k.slice(1)}<input id="e_${k}" value="${esc(e[k])}"></label>`).join('')}
  <label>Prioridad<select id="e_prioridad"><option value="2">2 – Normal</option><option value="7" ${e.prioridad>=7?'selected':''}>7 – Crítico</option></select></label>
  <label>Status (condición) <b style="color:var(--rojo)">*</b><select id="e_status" required><option value="" ${e.status?'':'selected'} disabled>-- Seleccione status --</option>${STATUS.map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></label>

function borraEq(id){if(!confirm('¿Eliminar equipo y sus planes?'))return;const e=DB.equipos.find(x=>x.id===id);

const FREQ=[[1,'Diario'],[7,'Semanal'],[14,'Cada 2 semanas'],[30,'Mensual'],[90,'Trimestral'],[180,'Semestral'],[365,'Anual']];
const frecTxt=d=>(FREQ.find(f=>f[0]==d)||[0,d+' días'])[1];
function editPlan(id,dup,eqId){
  const src=DB.planes.find(x=>x.id===id);
  const p=src?{...src}:{equipoId:eqId||'',descripcion:'',frecuencia:30,crew:'EMT',tareas:'',ultima:hoy(),activo:true};
  if(dup){p.descripcion+=' (copia)';id=''}
  const std=FREQ.some(f=>f[0]==p.frecuencia);
  modal_(`<h2>${dup?'Duplicar':id?'Editar':'Nuevo'} plan PM</h2><div class="grid">
  <label>Equipo <b style="color:var(--rojo)">*</b><select id="p_eq"><option value="">-- Seleccione equipo --</option>${DB.equipos.map(e=>`<option value="${e.id}" ${e.id===p.equipoId?'selected':''}>${esc(e.codigo+' – '+e.nombre)}</option>`).join('')}</select></label>
  <label>Descripción <b style="color:var(--rojo)">*</b><input id="p_desc" value="${esc(p.descripcion)}"></label>
  <label>Frecuencia<select id="p_fr" onchange="p_dias.parentElement.style.display=this.value==='0'?'block':'none'">${FREQ.map(f=>`<option value="${f[0]}" ${std&&f[0]==p.frecuencia?'selected':''}>${f[1]}</option>`).join('')}<option value="0" ${std?'':'selected'}>Personalizada (días)</option></select></label>
  <label style="display:${std?'none':'block'}">Cada cuántos días<input type="number" min="1" id="p_dias" value="${p.frecuencia}"></label>
  <label>Crew<select id="p_crew">${['EMT','CONTROL','CONTRATISTA'].map(c=>`<option ${c===p.crew?'selected':''}>${c}</option>`).join('')}</select></label>
  <label>Última realización<input type="date" id="p_ult" value="${p.ultima}" max="${hoy()}"></label>
  <label>Activo<select id="p_act"><option value="1">Sí</option><option value="0" ${p.activo?'':'selected'}>No</option></select></label></div>
  <label>Tareas / checklist (una por línea)<textarea id="p_tar" rows="7">${esc(p.tareas)}</textarea></label>
  <p style="font-size:12px;color:#666" id="p_prox"></p>
  <div class="row"><button class="btn v" onclick="guardaPlan('${id||''}')">💾 Guardar</button><button class="btn s" onclick="cerrar()">Cancelar</button>
  ${id&&puede(2)?`<button class="btn r" onclick="borraPlan('${id}')">🗑 Eliminar</button>`:''}</div>`);
  const upd=()=>{const f=p_fr.value==='0'?+p_dias.value:+p_fr.value;p_prox.textContent=f>0&&p_ult.value?'Próximo PM: '+addDias(p_ult.value,f):''};
  [p_fr,p_dias,p_ult].forEach(x=>x.addEventListener('input',upd));upd();
}
function guardaPlan(id){
  const f=p_fr.value==='0'?Math.round(+p_dias.value):+p_fr.value;
  const o={equipoId:p_eq.value,descripcion:p_desc.value.trim(),frecuencia:f,crew:p_crew.value,ultima:p_ult.value,activo:p_act.value==='1',tareas:p_tar.value.split('\n').map(t=>t.trim()).filter(Boolean).join('\n')};
  if(!o.equipoId) return alert('Seleccione el equipo');
  if(!o.descripcion) return alert('Falta descripción');
  if(!(f>=1)) return alert('La frecuencia debe ser de al menos 1 día');
  if(!o.ultima) return alert('Indique la fecha de última realización');
  if(id){
    const p=DB.planes.find(x=>x.id===id);Object.assign(p,o);
    DB.ots.filter(t=>t.planId===id&&t.estado!=='Completada').forEach(t=>{
      if(!o.activo){DB.ots=DB.ots.filter(x=>x.id!==t.id);return}
      Object.assign(t,{equipoId:o.equipoId,descripcion:o.descripcion,crew:o.crew,fin:prox(p),inicio:addDias(prox(p),-7)})});
    DB.ots=DB.ots.filter(t=>!(t.planId===id&&t.estado!=='Completada'&&diff(t.fin)>7));
    audit('Editó plan PM '+o.descripcion);
  }else{DB.planes.push({id:uid(),...o});audit('Creó plan PM '+o.descripcion+' ('+eqN(o.equipoId)+')')}
  generarOTs();save();cerrar();go('planes');
}
function borraPlan(id){
  const p=DB.planes.find(x=>x.id===id),ab=DB.ots.filter(t=>t.planId===id&&t.estado!=='Completada');
  if(!confirm(`¿Eliminar el plan "${p.descripcion}" de ${eqN(p.equipoId)}?`+(ab.length?`\n\nTambién se borrará(n) ${ab.length} orden(es) abierta(s) de este plan.`:'')+'\nEl historial de trabajos completados se conserva.'))return;
  DB.planes=DB.planes.filter(x=>x.id!==id);DB.ots=DB.ots.filter(t=>!(t.planId===id&&t.estado!=='Completada'));
  audit(`Eliminó plan PM ${p.descripcion} (${eqN(p.equipoId)})`);save();cerrar();go('planes');
}

async function setPass(u,pw){u.salt=sal();u.pass=await hash(u.salt+pw);u.passFecha=hoy()}

function reglaPass(p1,p2){
  if(p1.length<6) return 'La contraseña debe tener al menos 6 caracteres.';
  if(!/[A-Za-z]/.test(p1)||!/\d/.test(p1)) return 'La contraseña debe tener letras y números.';
  if(p1!==p2) return 'Las contraseñas no coinciden.';

}

async function guardaU(id){
  const usuario=u_u.value.trim(),nombre=u_n.value.trim(),rol=u_r.value,activo=u_a.value==='1';
  if(!usuario||!nombre) return alert('Complete usuario y nombre.');
  if(/\s/.test(usuario)) return alert('El usuario no puede tener espacios.');
  if(DB.usuarios.some(x=>x.usuario.toLowerCase()===usuario.toLowerCase()&&x.id!==id)) return alert('Ya existe un usuario "'+usuario+'".');
  const prev=DB.usuarios.find(x=>x.id===id);
  if(prev&&prev.rol==='Admin'&&prev.activo!==false&&(rol!=='Admin'||!activo)&&!adminsActivos(id)) return alert('Debe quedar al menos un Admin activo.');
  if(!id||u_p.value||u_p2.value){const e=reglaPass(u_p.value,u_p2.value);if(e)return alert(e)}
  const o=prev||{id:uid(),creado:hoy()};
  Object.assign(o,{usuario,nombre,rol,activo,tel:u_tel.value.replace(/\D/g,''),debeCambiar:u_dc.checked});
  if(u_p.value) await setPass(o,u_p.value);
  if(!prev) DB.usuarios.push(o);
  if(o.id===U.id) who.textContent=o.nombre+' ('+o.rol+')';
  audit(`${prev?'Editó':'Creó'} usuario ${usuario} (${rol}${activo?'':', inactivo'})${u_p.value?' – contraseña asignada':''}`);
  cerrar();R.usuarios();await guardadoOK('Usuario '+usuario);
}

function borraU(id){const u=DB.usuarios.find(x=>x.id===id);

function integridadBD(){
  const ids=new Set(DB.equipos.map(e=>e.id)),p=[];
  const dupC=DB.equipos.map(e=>e.codigo).filter((c,i,a)=>a.indexOf(c)!==i);
  if(dupC.length)p.push('Códigos de equipo duplicados: '+[...new Set(dupC)].join(', '));
  const pl=DB.planes.filter(x=>!ids.has(x.equipoId));if(pl.length)p.push(pl.length+' plan(es) PM sin equipo');
  const ot=DB.ots.filter(x=>!ids.has(x.equipoId));if(ot.length)p.push(ot.length+' orden(es)/registro(s) con equipo eliminado');
  const dn=DB.ots.map(o=>o.num).filter((c,i,a)=>a.indexOf(c)!==i);if(dn.length)p.push('Números de OT duplicados: '+[...new Set(dn)].join(', '));
  const sl=DB.ots.filter(o=>o.estado==='Completada'&&(!o.tecnico||!o.cierre));if(sl.length)p.push(sl.length+' registro(s) completados sin técnico o fecha');
  const se=DB.equipos.filter(e=>!e.status);if(se.length)p.push(se.length+' equipo(s) sin status');
  audit('Verificó integridad de la base de datos: '+(p.length?p.length+' problema(s)':'OK'));
  alert(p.length?'⚠️ Problemas encontrados:\n\n• '+p.join('\n• '):'✅ Base de datos íntegra: sin problemas.\n\n'+DB.equipos.length+' equipos · '+DB.planes.length+' planes · '+DB.ots.length+' órdenes/registros · '+DB.usuarios.length+' usuarios');
}

/* ---- Exportar XLSX real (sin librerías) ---- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const [name,txt] of files){
    const n=enc.encode(name),d=enc.encode(txt),c=crc32(d);
    const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0)]);
    parts.push(h,n,d);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
    off+=h.length+n.length+d.length;
  }
  const cs=cen.reduce((a,x)=>a+x.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function colL(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s}
const xe=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function hojaXML(rows,anchos){
  const cols='<cols>'+anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  const data=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=colL(ci)+(ri+1),s=ri===0?' s="1"':'';
    if(v===null||v===undefined||v==='') return ri===0?`<c r="${ref}"${s}/>`:'';
    if(typeof v==='number'&&isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')+'</row>').join('');
  const last=colL(rows[0].length-1)+rows.length;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${data}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
}
function libroXLSX(hojas){
  const ws=hojas.map((h,i)=>[`xl/worksheets/sheet${i+1}.xml`,hojaXML(h.rows,h.w)]);
  const f=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
   ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${hojas.map((h,i)=>`<sheet name="${xe(h.n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
   ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B3D91"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf fontId="0" fillId="0" borderId="0"/><xf fontId="1" fillId="2" borderId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
   ...ws];
  return zip(f);
}
function exportXLSX(){
  const l=document.getElementById('b_d')?filtroRegs():regs();

  const hojas=[
   {n:'Registros',w:[12,12,16,32,8,40,11,22,8,22,26,12,40,18],rows:[['N° Registro','Fecha','Código Equipo','Equipo','Tipo','Descripción del trabajo','Crew','Técnico','Horas','Resultado','Repuestos usados','Costo repuestos ($)','Hallazgos / Notas','Registrado por'],

   {n:'Planes_PM',w:[16,34,48,12,12,14,14,12],rows:[['Código Equipo','Equipo','Descripción PM','Frecuencia (días)','Crew','Última realización','Próximo PM','Activo'],...DB.planes.map(p=>[eqC(p.equipoId),eqN(p.equipoId),p.descripcion,p.frecuencia,p.crew,p.ultima,prox(p),p.activo?'Sí':'No'])]},

  const b=libroXLSX(hojas),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ManteniPro_BaseDatos_'+hoy()+'.xlsx';a.click();
  audit(`Exportó base de datos a Excel (${l.length} registros)`);
}
