services:
  - type: web
    name: mantenipro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mantenipro-db
          property: connectionString
databases:
  - name: mantenipro-db
    databaseName: mantenipro
    user: mantenipro
